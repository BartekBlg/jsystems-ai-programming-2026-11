# Context tests never call the LLM (T20): allow startup without OPENROUTER_API_KEY.
llm.allow-missing-key=true
# Tests never call the real Decisions API by default; mode tests set the mode explicitly (T25).
app.decisions.mode=llm-only
app.decisions.url=http://127.0.0.1:9/decisions-disabled-in-tests
app.rate-limit.decisions-per-hour=1000
