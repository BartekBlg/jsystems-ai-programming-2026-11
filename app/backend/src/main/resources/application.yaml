# ADR-001 §3.7. Secrets come only from environment variables (ADR-000 §7).
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Tomcat swallows (reads and discards) at most this much of a rejected request body before it closes the
    # connection without delivering the response. The 2 MB default is below the overshoot of a ~12-13 MB upload,
    # so the client would see a connection reset instead of 413 PHOTO_TOO_LARGE.
    max-swallow-size: 16MB
  compression:
    enabled: false
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: service-copilot
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    async:
      request-timeout: 95s
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

# T05 shared contracts: env bindings (ADR-000 §7)
llm:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  model: ${LLM_MODEL:openai/gpt-6-luna}
  vision-model: ${LLM_VISION_MODEL:openai/gpt-6-luna}
  decision-reasoning-effort: ${LLM_DECISION_REASONING_EFFORT:medium}
  chat-reasoning-effort: ${LLM_CHAT_REASONING_EFFORT:low}
  timeouts:
    vision: 26s
    decision: 34s
    chat-first-token: 30s
    chat-total: 90s
  max-output-tokens:
    vision: 4000
    decision: 8000
    chat: 4000

app:
  case-signing-key: ${CASE_SIGNING_KEY:}
  rate-limit:
    cases-per-hour: ${RATE_LIMIT_CASES_PER_HOUR:10}
    chat-per-hour: ${RATE_LIMIT_CHAT_PER_HOUR:60}
    decisions-per-hour: ${RATE_LIMIT_DECISIONS_PER_HOUR:30}
  decisions:
    mode: ${DECISIONS_MODE:shadow}
    model: ${DECISIONS_MODEL:typesafe/jev-1.14}
    url: ${DECISIONS_URL:https://openrouter.ai/api/alpha/decisions}
    confidence-threshold: ${DECISIONS_CONFIDENCE_THRESHOLD:0.80}
    timeout: 6s
