# ADR-001 §3.7. Secrets come only from environment variables (ADR-000 §7).
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: false
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: service-copilot
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    async:
      request-timeout: 90s
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
