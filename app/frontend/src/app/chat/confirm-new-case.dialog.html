<h2 mat-dialog-title>{{ labels.text }}</h2>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ labels.cancel }}</button>
  <button mat-flat-button type="button" class="confirm-button" (click)="confirm()">
    {{ labels.confirm }}
  </button>
</mat-dialog-actions>
